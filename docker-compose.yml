# Self-hosted stack: nginx (static site + load balancer) -> 2 Spring Boot API
# replicas -> Supabase Postgres (pooled connection string in .env).
#
#   cp .env.docker.example .env   # fill in DB_URL / DB_USERNAME / DB_PASSWORD / ADMIN_PASSWORD
#   docker compose up --build
#
# The Vercel deployment does NOT need this: it uses the serverless API in
# frontend/api. This stack is for running your own servers.
services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    expose:
      - '8080'

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'
