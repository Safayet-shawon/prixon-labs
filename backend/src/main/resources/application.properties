spring.application.name=praxivon-api
server.port=${PORT:8080}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
praxivon.contact.to=${CONTACT_TO:}
praxivon.contact.from=${CONTACT_FROM:}
praxivon.cors.origins=${CORS_ORIGINS:}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/praxivon;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
praxivon.admin.username=${ADMIN_USERNAME:admin}
praxivon.admin.password=${ADMIN_PASSWORD:}
