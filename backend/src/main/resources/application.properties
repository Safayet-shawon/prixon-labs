spring.application.name=praxivon-api
server.port=${PORT:8080}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
praxivon.contact.to=${CONTACT_TO:}
praxivon.contact.from=${CONTACT_FROM:}
praxivon.cors.origins=${CORS_ORIGINS:}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/praxivon;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.h2.console.enabled=false
praxivon.admin.username=${ADMIN_USERNAME:admin}
praxivon.admin.password=${ADMIN_PASSWORD:}

# Connection pooling (HikariCP). Keep the pool small when using Supabase's
# transaction pooler so several API replicas never exhaust the connection limit.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000

# Response compression and graceful shutdown for rolling restarts behind a load balancer.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=512
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
